# Production: database, API, web app, HTTPS proxy and daily backups on one server.
# Run from the repository root:
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
name: krisimandi

x-db-url: &db-url postgresql://krisimandi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/krisimandi

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: krisimandi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: krisimandi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krisimandi"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: { context: .., target: api }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *db-url
      UPLOAD_DIR: /data/uploads
      WEB_ORIGIN: https://${DOMAIN}
      PORT: 4000
    volumes:
      - uploads:/data/uploads
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ..
      target: web
      args:
        NEXT_PUBLIC_SUPPORT_PHONE: ${NEXT_PUBLIC_SUPPORT_PHONE:-}
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: krisimandi
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: krisimandi
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
      - uploads:/uploads:ro
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
