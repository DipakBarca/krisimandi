name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: krisimandi
          POSTGRES_PASSWORD: krisimandi
          POSTGRES_DB: krisimandi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U krisimandi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://krisimandi:krisimandi@localhost:5432/krisimandi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        working-directory: packages/db
      - run: npx prisma migrate deploy
        working-directory: packages/db
      - run: npx prisma db seed
        working-directory: packages/db
      - run: npm run typecheck -w @krisimandi/api
      - run: npm run build -w @krisimandi/api
      - run: npm test -w @krisimandi/api
      - run: npm run typecheck -w @krisimandi/web
      - run: npm run build -w @krisimandi/web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
      - name: Check the production compose file
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=x/' deploy/.env
          docker compose -f deploy/compose.yml --env-file deploy/.env config --quiet
